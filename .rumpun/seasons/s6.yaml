    eval_window: "generator runs + the full demo sweep"
  pipeline:
    - phase: implement
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: "assets/ tools/ docs/ vendors/"
    - phase: verify
      primitive: evaluate
      agents: writers
      prompt: prompts/base/evaluate.md
      reads: "assets/ tools/ docs/ vendors/"
      writes: "REPO_ANALYSIS/s6-verify.md"
writers:
