goal: "Polish: strengthen the studio theme, deepen Kiki's sad frown, remove dead code (terminal minH, empty loop, unused scene), fix stale generator output paths, align every doc with reality"
metric: "all generators run from current paths, all 11 themes pass probes, Kiki sad reads clearly in a render, all demos render+lint green, docs match reality"
