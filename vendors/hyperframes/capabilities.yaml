# What the hyperframes vendor renders from the canonical schema.
engine: hyperframes
supported:
  visual_types: [text, image, terminal, video]
  emotions: true          # needs <emotion>_open/close.png art
  se: true
  bgm: true               # segmented bed, ducked under voice
  scene_backgrounds: true
  translations: true
  language_variants: true
  playback_rate: true
  lip_sync: true
degraded:
  incremental_render: >-
    render v0.8.96 has no frame-range flag; --resume only survives
    unchanged compositions (segment hash covers the whole compiled HTML),
    so every render is a full render
