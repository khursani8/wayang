# =============================================================
# storytelling template - two-host narrative skit with emotions
# Works as-is after init. Emotions show once you add character art.
# =============================================================
meta:
  title: "ちいさな宝物"
  template: storytelling
  vendor: remotion
  language: ja
  description: "narrative skit, emotions sprinkled, mood cards"

characters:
  zundamon:
    name: ずんだもん
    color: "#228B22"
    position: right
    voice:
      engine: voicevox
      speaker_id: 3
  metan:
    name: 四国めたん
    color: "#FF1493"
    position: left
    voice:
      engine: voicevox
      speaker_id: 2

script:
  - id: 1
    character: zundamon
    text: "きょう、川辺で光る石を見つけたのだ！"
    scene: 1
    pause_after: 0.4
    emotion: surprised
    visual:
      type: text
      text: "光る石"
      font_size: 90
      color: "#ffffff"
      animation: zoomIn
  - id: 2
    character: metan
    text: "光る石？ただのガラスじゃないの？"
    scene: 1
    pause_after: 0.4
    emotion: thinking
  - id: 3
    character: zundamon
    text: "わふ！あったかい光が出てきたのだ！"
    scene: 2
    pause_after: 0.6
    emotion: happy
    visual:
      type: text
      text: "まばゆい光"
      font_size: 84
      color: "#ffffff"
      animation: bounce
  - id: 4
    character: metan
    text: "それは……ほんものの宝物かも。"
    scene: 2
    pause_after: 0.6
    emotion: surprised
  - id: 5
    character: zundamon
    text: "きょうは一緒に探検してくれてありがとうなのだ。"
    scene: 3
    pause_after: 0.4
    visual:
      type: text
      text: "ちいさな宝物"
      font_size: 88
      color: "#ffffff"
      animation: zoomIn
  - id: 6
    character: metan
    text: "こちらこそ、また行こうね。"
    scene: 3
    pause_after: 1.0
    emotion: happy

settings:
  video:
    width: 1920
    height: 1080
    fps: 30
    playback_rate: 1.2
  font:
    family: "M PLUS Rounded 1c"
    size: 70
    weight: "900"
    color: "#ffffff"
  subtitle:
    bottom_offset: 40
    max_width_percent: 55
    outline_width: 14
  character:
    height: 275
    use_images: false

vendor:
  remotion:
    estimate_cps: 7.5
