[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wayang"
version = "0.2.0"
description = "Wayang: YAML-template video platform, installable as wayang <command>"
license = "MIT"
authors = [{ name = "khursani8" }]
keywords = ["video", "tts", "mascots", "agent", "malay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "pillow>=10.0",
]

[project.scripts]
wayang = "wayang.cli:main"

[project.urls]
Homepage = "https://github.com/khursani8/wayang"
Issues = "https://github.com/khursani8/wayang/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wayang"]
