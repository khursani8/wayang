# s4 - creator features batch 1 (the S-effort + P0 set)
id: s4
parent: s3
goal: "Ship: caption export (SRT/VTT from timeline.json), voices browser (revolab ids in the CLI), line preview (tts --line N audition), stats command (duration/talk-time estimate), title and closing cards, init-episode scaffold, Rimau in the default cast"
metric: "each feature demonstrated on a demo project: captions.srt exists and parses, audition wav plays, stats --json accurate vs render, title/closing cards visible, init-episode scaffolds from series.yaml"
mode: fight
methodology:
  approach: "platform-level features (no engine changes except card frames); GLM P0 trio + sol quick wins"
  evidence: []
  primary_change:
    type: add
    node: creator-commands
    baseline: "no caption export, no voice browsing/preview, no stats, no title/end cards"
    expected_band: "all listed features demonstrable; existing demos unaffected"
    rollback: "git revert to the s3 head"
    eval_window: "feature demos + full demo-project render sweep"
  pipeline:
    - phase: implement
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: "tools/ templates/ vendors/"
    - phase: render
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      reads: "tools/ templates/ vendors/"
      writes: "projects/video-tutorial/out/video.mp4 projects/video-tutorial/out/timeline.json"
    - phase: verify
      primitive: evaluate
      agents: writers
      prompt: prompts/base/evaluate.md
      reads: "projects/video-tutorial/out/video.mp4 projects/video-tutorial/out/timeline.json"
      writes: "REPO_ANALYSIS/s4-verify.md"
writers:
  - name: fable
    route: fable
    lane: solo
    prompt: prompts/base/execute.md
    knowledge: full
    budget: {minutes: 240}
stop:
  "on": [all_exited]
