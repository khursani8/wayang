# s7 - new capability: the Shorts suggester (ledger directive seq 9)
id: s7
parent: s6
goal: "Shorts suggester: sample a long video (frames + audio curve), run a Claude vision analysis, and emit a shorts plan (clip windows, portrait crop boxes, suggested titles), with optional clip rendering through the pipeline"
metric: "E2E on projects/wayang-tutorial/out/video.mp4: sample writes a brief dir, the analysis consumes it, the plan declares at least one clip window + portrait crop + title, an optional render produces a portrait mp4 verified by frame probe, lint green"
mode: fight
methodology:
  approach: "one writer; ffmpeg-only sampling; the analysis step is an agent session over the sampled brief; verify with frame probes on real renders, not logs"
  evidence: []
  primary_change:
    type: add
    node: shorts-pipeline
    baseline: "no long-video understanding; portrait renders exist only as full-project --preset portrait, no clip windows or titles"
    expected_band: "WIN if the E2E plan + portrait crop render verifies on the real project output; LOSS if sampling or crop cannot run on this box"
    rollback: "git revert to the s6 head"
    eval_window: "the s7 verify pass + the rendered clip artifacts"
  pipeline:
    - phase: implement
      primitive: execute
      agents: writers
      prompt: prompts/base/execute.md
      writes: "src/wayang/ docs/ projects/"
    - phase: verify
      primitive: evaluate
      agents: writers
      prompt: prompts/base/evaluate.md
      reads: "src/wayang/ projects/"
      writes: ".rumpun/runs/s7/"
writers:
  - name: fable
    route: fable
    lane: solo
    prompt: prompts/base/execute.md
    knowledge: full
    budget: {minutes: 240}
stop:
  "on": [all_exited]
